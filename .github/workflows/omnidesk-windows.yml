name: Arsenal Windows installer
on:
  push:
    branches: [omnidesk-windows]
    paths: ['desktop/**', 'scripts/prepare_apps.py', 'apps.lock.json', '.github/workflows/omnidesk-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/releases
          key: omnidesk-engines-${{ hashFiles('apps.lock.json') }}
      - run: npm ci
      - run: npm run prepare:apps
      - run: npm run prepare:capcut
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - run: npm run prepare:omniget
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
      - run: npm run build
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer checksum
        shell: pwsh
        run: Get-FileHash release/Arsenal-Setup-1.3.1-x64.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Arsenal-Windows-Installer
          path: |
            desktop/release/Arsenal-Setup-*.exe
            desktop/release/SHA256.txt
          compression-level: 0
